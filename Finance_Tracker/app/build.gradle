plugins {
    id("com.android.application")
    id("com.google.gms.google-services")
}

android {
    namespace 'com.example.finance'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.finance"   // must match Firebase project
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true  // optional but recommended
    }
}

dependencies {
    // AndroidX & Material
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // Firebase
    implementation libs.firebase.database
    implementation libs.firebase.auth
    implementation libs.firebase.firestore

    // Google Play Services (replace with what you need)
    implementation 'com.google.firebase:firebase-auth:22.3.1'
    implementation 'com.google.firebase:firebase-firestore:24.10.0'
    implementation 'com.google.android.gms:play-services-auth:20.6.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'


    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}

// 🔹 Apply google-services plugin at the end (if alias doesn't work)
apply plugin: 'com.google.gms.google-services'
